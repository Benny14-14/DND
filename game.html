<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - The Digital Dungeon</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div id="app">
        <header class="game-header">
            <h1 id="game-title"></h1>
            <div class="header-actions">
                <button id="back-to-lobby" class="btn btn-secondary">Back to Lobby</button>
            </div>
        </header>

        <main class="game-main">
            <div class="game-board"></div>
            <div class="side-panel">
                <div class="character-sheets">
                    <character-sheet></character-sheet>
                </div>
                <div class="chat">
                    <chat-box></chat-box>
                </div>
                <dice-roller></dice-roller>
            </div>
        </main>
    </div>
    <script src="firebase.js" type="module"></script>
    <script src="components/character-sheet.js" type="module"></script>
    <script src="components/chat-box.js" type="module"></script>
    <script src="components/dice-roller.js" type="module"></script>
    <script src="game.js" type="module"></script>
</body>
</html>
